name: DevSecOps Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm test

  security-sast-secrets:
    name: Gitleaks & Semgrep
    runs-on: ubuntu-latest
    needs: build-and-test # Ждет успешного прохождения тестов
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Нужно для Gitleaks, чтобы проверить всю историю коммитов

      - name: Gitleaks (Поиск секретов)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep (SAST сканирование кода)
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"

  docker-security-build:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: security-sast-secrets
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Обрати внимание: теперь мы тегируем образ с добавлением твоего логина
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/my-secure-app:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/my-secure-app:latest'
          format: 'table'
          exit-code: '0' 
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Новый шаг: Авторизация в Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Новый шаг: Отправка образа
      - name: Push to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/my-secure-app:latest
