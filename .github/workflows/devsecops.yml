name: DevSecOps Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm test

  security-sast-secrets:
    name: Gitleaks & Semgrep
    runs-on: ubuntu-latest
    needs: build-and-test # Ждет успешного прохождения тестов
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Нужно для Gitleaks, чтобы проверить всю историю коммитов

      - name: Gitleaks (Поиск секретов)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep (SAST сканирование кода)
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"

  docker-security-build:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: security-sast-secrets # Ждет успешной проверки кода
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t my-secure-app:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-secure-app:latest'
          format: 'table'
          exit-code: '0' # Пока ставим 0, чтобы пайплайн не падал, если найдет уязвимости (Soft fail)
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'